<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevBlog</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <header class="hero">
    <div class="overlay"></div>

    <div class="hero-content">
      <h1>✍️ DevBlog</h1>
      <p>Share your thoughts, stories, and ideas with the world.</p>

      <a href="#create" class="hero-btn">
        Start Writing
      </a>
    </div>
  </header>

  <main class="container">

    <section id="create" class="form-section">
      <div class="form-card">

        <h2>Create a Blog Post</h2>

        <div class="input-group">
          <label>Blog Title</label>
          <input id="title" type="text" placeholder="Enter blog title..." />
        </div>

        <div class="input-group">
          <label>Cover Image URL</label>
          <input id="image" type="text" placeholder="Paste image URL..." />
        </div>

        <div class="input-group">
          <label>Content</label>
          <textarea id="content" placeholder="Write your amazing blog here..."></textarea>
        </div>

        <button onclick="createPost()">
          🚀 Publish Blog
        </button>

      </div>
    </section>

    <section class="posts-section">
      <h2 class="section-title">Latest Posts</h2>

      <section id="posts" class="grid"></section>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
